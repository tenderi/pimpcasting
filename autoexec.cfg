// autoexec.cfg - runs once at game launch.
// Switch between configs in-game with F12 (playing) / F11 (casting).
// Disable the Steam overlay screenshot key (default F12) or move it, otherwise it fires too.

con_enable 1

bind "F12" "exec playing.cfg"
bind "F11" "exec pimpcasting.cfg"
bind "F10" "toggle dota_hud_netgraph"

exec playing.cfg
//exec pimpcasting.cfg

echoln "autoexec loaded"
