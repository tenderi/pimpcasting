// playing.cfg - hero gameplay config. Loaded at launch by autoexec.cfg and on F12.
// Every convar that pimpcasting.cfg changes is reset here, so switching back is always clean.
// Values below were taken from the live client settings on 2026-09-14.
// Hotkeys for abilities/items/etc. live in the in-game Hotkeys menu (profile "ARROW"), not here.

//////////////////////////////////////////////////
//              Performance                     //
//////////////////////////////////////////////////

fps_max 300
engine_no_focus_sleep 20
mic_listen_while_nonfocused 0

//////////////////////////////////////////////////
//              Camera                          //
//////////////////////////////////////////////////

dota_camera_speed 6000
dota_camera_accelerate 50
dota_camera_edgemove 1
dota_camera_disable_zoom 1
dota_camera_disable_yaw 0
dota_camera_reverse 0
dota_camera_deatheffect 1
dota_reset_camera_on_spawn 0
dota_camera_lock_lerp 0
dota_camera_hold_select_to_follow 0
dota_camera_dotatv_smooth_drag 1
dota_mouse_window_lock 1
dota_leftclick_cameragrip_new 0

// Hold SPACE to lock the camera on your hero, release to free it.
alias "+camhold" "dota_camera_lock 1"
alias "-camhold" "dota_camera_lock 0"
bind "SPACE" "+camhold"

//////////////////////////////////////////////////
//              Minimap                         //
//////////////////////////////////////////////////

dota_minimap_always_draw_hero_icons 1
dota_minimap_hero_size 758
dota_minimap_rune_size 700
dota_minimap_hero_scalar 1
dota_minimap_hero_scalar_distance 20
dota_minimap_hero_scalar_minimum 600
dota_minimap_hero_spread 0
dota_minimap_simple_background 1
dota_minimap_simple_colors 0
dota_minimap_misclick_time 0.2
dota_minimap_show_cast_range 1
dota_minimap_disable_rightclick 0

//////////////////////////////////////////////////
//              Casting behaviour               //
//////////////////////////////////////////////////

dota_ability_quick_cast 1
dota_quickcast_onkeydown 1
dota_enable_direct_quickcast_bindings 0
dota_ability_self_cast_timeout 0.6
dota_item_double_tap_self_cast 1
dota_smart_doubletap 1
dota_show_range_finder_on_quickcast_down 0
dota_enable_range_finder 0
dota_continue_click_movement_after_cast_cancel 1
dota_ability_use_original_cast_mode_for_stolen_spell 1
dota_inhibit_query_after_cast 0
dota_swap_mouse_spellcast 0

//////////////////////////////////////////////////
//              Unit control                    //
//////////////////////////////////////////////////

dota_player_units_auto_attack_mode 1
dota_summoned_units_auto_attack_mode_2 2
dota_disable_autoattack_during_stop 1
dota_toggle_autoattack_automatically_during_orders 0
dota_player_teleport_requires_halt 1
dota_player_channels_require_stop 0
dota_player_interaction_channels_require_stop 1
dota_player_add_summoned_to_selection 0
dota_player_auto_repeat_right_mouse 0
dota_player_multipler_orders 0
dota_player_smart_multiunit_cast 0
dota_player_selection_cycle_ignores_groups 0
dota_selection_groups 1
dota_force_right_click_attack 0
dota_settings_quick_move 0
dota_settings_quick_target_attack 0
dota_settings_targeted_attack_move 0
cl_dota_alt_unit_movetodirection 0

//////////////////////////////////////////////////
//              Shop & courier                  //
//////////////////////////////////////////////////

dota_shop_force_hotkeys 0
dota_shop_allow_hotkeys_on_shift 1
dota_shop_search_autofocus 1
dota_quickbuy_rightclick_marksforbuy 1
dota_auto_mark_for_buy 0
dota_shop_mark_for_buy_secret_shop_item 1
dota_courier_autodeliver 0
dota_auto_courier_deliver_visible_only 0
dota_auto_courier_auto_burst 0
dota_turbo_courier_default_auto_deliver 1
hud_sticky_item_name item_tpscroll

//////////////////////////////////////////////////
//              HUD & info                      //
//////////////////////////////////////////////////

dota_hud_flip 1
dota_hud_colorblind 2
dota_hud_netgraph 1
dota_hud_healthbar_local_player_high_visibility 0
dota_hud_disable_damage_numbers 0
dota_hud_queued_orders_enable 1
dota_hud_contextual_tips_disable 1
dota_help_tips_enabled 0
dota_hud_reduced_flash 0
dota_damage_flash 1
dota_screen_shake 0
dota_health_bar_hurt_effect 1
dota_health_bar_healing_effect 0
dota_hud_enable_dispel_effect 0
dota_hud_extra_large_minimap 0
dota_show_hero_finder 1
dota_always_show_hero_finder 0
dota_hero_overhead_names 1
dota_show_cast_range 1
dota_show_nearby_tower_attack_range 1
dota_alt_shows_tower_attack_range 1
dota_alt_right_range_hint 1
dota_alt_shows_neutral_spawn_boxes 1
dota_alt_show_rune_spawn_times 1
dota_alt_show_neutral_stack_times_and_arrow 1
dota_alt_show_lane_creep_gold_bounty 1
dota_alt_show_neutral_creep_gold_bounty 1
dota_alt_show_ward_suggestions 1
dota_preview_teleport_channel_time 1
dota_show_teleport_channel_time 1
dota_ping_menu_delay 0.15
dota_fight_recap_terse 0
dota_spec_talentchanges_show 1

//////////////////////////////////////////////////
//              Comms                           //
//////////////////////////////////////////////////

chat_sound 0
dota_chat_allow_global 1
voice_modenable 1
voice_threshold -60

bind "MOUSE4" "+voicerecord"
bind "MOUSE5" "+chatwheel"

//////////////////////////////////////////////////
//              Undo casting-only binds         //
//////////////////////////////////////////////////

unbind "SHIFT"
unbind "k"
unbind "l"

echoln "Executed playing.cfg"
