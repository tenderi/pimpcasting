// pimpcasting.cfg - casting / observer config. Load with F11, go back to playing with F12.
// Based on the 0.7.1 (2020) config by Jonathan "PimpmuckL" Liebig, revised 2026-09-14
// against the current client: every command below exists in the installed binary,
// cheat-protected fog commands are gone, and the 7.33+ map coordinates are used.
// Spectator hotkeys (WASD camera, stat panels, FOW toggles) live in the in-game Hotkeys menu.

//////////////////////////////////////////////////
//              Performance                     //
//////////////////////////////////////////////////

// Cap to a multiple of your stream framerate for even frame pacing (300 = playing value).
fps_max 300

// Keep rendering and the mic alive when the game is not the focused window (OBS, DotaTV, etc.)
engine_no_focus_sleep 0
mic_listen_while_nonfocused 1

//////////////////////////////////////////////////
//              Camera                          //
//////////////////////////////////////////////////

// Slower, smoother camera than when playing.
dota_camera_speed 3000
dota_camera_accelerate 5

// Never auto zoom back in, allow free zoom, no yaw, no edge panning.
dota_camera_zoom_return_to_default_time_spectator_enabled 0
dota_camera_disable_zoom 0
dota_camera_disable_yaw 1
dota_camera_edgemove 0

// Zoom per mousewheel notch - raise the *_direction_multiplier values for bigger steps.
dota_camera_broadcaster_mousewheel_direction_multiplier 0.0025
dota_camera_broadcaster_mousewheel_frametime_multiplier 3
dota_camera_mousewheel_direction_multiplier 0.0025
dota_camera_mousewheel_delay_reset_interval 0
dota_camera_mousewheel_start_delay 0.1

// Spectator-only window lock: 0 lets the cursor leave the game on multi-monitor setups.
dota_mouse_spectator_window_lock 0
dota_spectator_enable_edgepan_temporary_free_camera 1
dota_camera_temporary_freecamera_time 2.5

// Hold SPACE to follow the selected hero. Does NOT work while assisted camera is on.
dota_camera_hold_select_to_follow 1
bind "SPACE" "+dota_camera_follow"

//////////////////////////////////////////////////
//              Minimap                         //
//////////////////////////////////////////////////

dota_minimap_always_draw_hero_icons 0
dota_minimap_hero_size 750
dota_minimap_rune_size 500
dota_minimap_hero_scalar 1
dota_minimap_hero_scalar_distance 5
dota_minimap_hero_scalar_minimum 500

// Yellow outline of the co-caster's camera on the minimap.
dota_minimap_draw_cocaster_camera 1

// Camera jumps to the power runes (coordinates from your saved camera positions 1 & 2).
// Re-measure after a map patch: open the console and run dota_camera_get_pos at the spot.
bind "k" "dota_camera_set_lookatpos -2230 1630"
bind "l" "dota_camera_set_lookatpos 2800 -2345"

//////////////////////////////////////////////////
//              Broadcast HUD                   //
//////////////////////////////////////////////////

dota_fight_recap_terse 1
dota_hud_netgraph 0
dota_spec_talentchanges_show 0
dota_spectator_use_broadcaster_stats_panel 1
dota_spectator_pin_open 1
dota_spectator_options_autohide 1
dota_spectator_graph_hide_win_probability 0
dota_mute_cobroadcasters 0
dota_alt_shows_neutral_spawn_boxes 1

//////////////////////////////////////////////////
//              Keybinds                        //
//////////////////////////////////////////////////

// Hold SHIFT for assisted camera, or toggle it with MOUSE4.
alias "+assisted" "dota_toggle_assisted_camera_operator"
alias "-assisted" "dota_toggle_assisted_camera_operator"
bind "SHIFT" "+assisted"
bind "MOUSE4" "dota_toggle_assisted_camera_operator"
unbind "MOUSE5"

// Combat log to file, if you post-process games.
//dota_combatlog_file "combatlog_out.txt"

//////////////////////////////////////////////////
//              Tournament / LAN                //
//////////////////////////////////////////////////

// Mutes Roshan and smoke sounds for on-stage productions.
//dota_silent_roshan 1

// Old-style draft overlay. Launch with -ti_onstage 1, then bind draftToggle.
alias draftOn "dota_ti_onstage_overlay 1; alias draftToggle draftOff"
alias draftOff "dota_ti_onstage_overlay 0; alias draftToggle draftOn"
alias draftToggle draftOn
//bind "HOME" draftToggle

// Lower-third draft interface. Do not combine with the overlay above.
alias ltDraftOn "dota_spectator_broadcaster_mode 1; alias ltDraftToggle ltDraftOff"
alias ltDraftOff "dota_spectator_broadcaster_mode 0; alias ltDraftToggle ltDraftOn"
alias ltDraftToggle ltDraftOn
//bind "HOME" ltDraftToggle

echoln "Executed pimpcasting.cfg"
